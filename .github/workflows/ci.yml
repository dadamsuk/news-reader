name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # A tag such as v1.0.1 builds both platforms with the production profile and submits them:
  # Android to the Play internal testing track, iOS to TestFlight.
  # Needs the EXPO_TOKEN secret, plus the store credentials set up once with `eas credentials`
  # and `eas submit` (see docs/deploy.md).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform all --profile production --non-interactive --auto-submit --no-wait
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
